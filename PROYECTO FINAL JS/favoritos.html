<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Favoritos - Integrante 3</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#040406">
</head>
<body>
  <h1>Mis Favoritos</h1>
  <p><a href="detalle.html">Volver al detalle</a> • <a href="logros.html">Ver logros</a></p>
  <div id="list" class="list">Cargando favoritos...</div>
  <script>
    function readJSON(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }
    function writeJSON(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
    var listEl = document.getElementById('list');
    var favorites = readJSON('favorites') || [];
    if(!favorites.length){ listEl.innerHTML = '<em>No tienes favoritos todavía.</em>'; }
    else{
      // En este ejemplo usamos datos estáticos para mostrar título y precio; en integración real se haría fetch      var sampleCatalog = {
        minecraft: {id:'minecraft', title:'Minecraft', price:89.90},
        gtav: {id:'gtav', title:'GTA V', price:79.90}
      };
      listEl.innerHTML = '';
      favorites.forEach(function(id){
        var data = sampleCatalog[id] || {id:id, title:id, price:0};
        var div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = '<div><strong>'+data.title+'</strong><br>S/ '+data.price.toFixed(2)+'</div>'+
                       '<div><button class="remove">Eliminar</button> <a href="detalle.html">Ver</a></div>';
        (function(gameId, node){
          node.querySelector('.remove').addEventListener('click', function(){
            var arr = readJSON('favorites') || [];
            var idx = arr.indexOf(gameId);
            if(idx !== -1){ arr.splice(idx,1); writeJSON('favorites', arr); node.parentNode.removeChild(node); }
            if((readJSON('favorites')||[]).length === 0) listEl.innerHTML = '<em>No tienes favoritos todavía.</em>';
          });
        })(id,div);
        listEl.appendChild(div);
      });
    }
  </script>
</body>
</html>
