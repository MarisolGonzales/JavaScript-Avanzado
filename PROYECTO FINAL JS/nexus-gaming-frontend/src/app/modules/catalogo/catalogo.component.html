<header class="page-header">
  <h1>Catálogo</h1>
  <p>Explora todos los juegos disponibles, filtra por categoría o busca por título.</p>
</header>

<main class="page-body">
  <section class="catalog-tools">
    <label class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        type="search"
        placeholder="Buscar títulos, géneros o franquicias..."
        autocomplete="off"
        [(ngModel)]="textoBusqueda"
        (ngModelChange)="onBuscar()">
    </label>

    <div class="category-filters">
      <button
        *ngFor="let categoria of categorias"
        class="filter-chip"
        [class.active]="categoria === categoriaActiva"
        (click)="seleccionarCategoria(categoria)">
        {{ categoria }}
      </button>
    </div>
  </section>

  <section class="catalog-rows">
    <h2 class="catalog-row-title" *ngIf="juegosFiltrados.length > 0">Todos los juegos disponibles</h2>

    <div class="games-rail" *ngIf="juegosFiltrados.length > 0; else sinResultados">
      <div class="game-card" *ngFor="let juego of juegosFiltrados">
        <img class="game-thumb" [src]="juego.image" [alt]="juego.title">
        <div class="game-info">
          <div class="game-top">
            <span class="tag">{{ juego.category }}</span>
            <span class="price">{{ juego.price | soles }}</span>
          </div>
          <h3>{{ juego.title }}</h3>
          <p class="game-desc">{{ juego.description }}</p>
          <div class="game-actions">
            <button class="btn-secondary" (click)="abrirDetalle(juego)">Detalles</button>
            <button class="btn-buy" (click)="agregarAlCarrito(juego)">Comprar</button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #sinResultados>
      <div class="empty-state">
        <i class="fa-solid fa-magnifying-glass"></i>
        <h3>No se encontraron juegos</h3>
        <p>Prueba con otro término de búsqueda o categoría.</p>
      </div>
    </ng-template>
  </section>
</main>

<app-modal-detalle-juego
  [juego]="juegoSeleccionado"
  (cerrar)="cerrarDetalle()"
  (comprar)="agregarAlCarrito($event)">
</app-modal-detalle-juego>
