<!doctype html>
<html lang="es-PE" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>NEXUS GAMING</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NEXUS GAMING: tienda de videojuegos con sedes en Trujillo, Arequipa y Cusco.">
  <meta name="theme-color" content="#0a0a0e">
  <link rel="icon" type="image/png" href="assets/img/nexus-icon.png">
  <script>
    /* Aplica el tema guardado ANTES de que cargue Angular, para que la página no parpadee. */
    try { var t = JSON.parse(localStorage.getItem('nexus_tema') || 'null');
      if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t === 'claro' ? 'light' : 'dark'); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

</body>
</html>
