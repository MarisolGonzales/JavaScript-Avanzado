<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca - NEXUS GAMING</title>
    <!-- Ruta relativa para subir 2 niveles y encontrar styles.css -->
    <link rel="stylesheet" href="../../styles.css">
    <style>
        .biblioteca-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .biblioteca-header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }
        .biblioteca-header h2 {
            font-size: 24px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .biblioteca-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }
        .grid-biblioteca {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .game-card-lib {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .game-card-lib:hover {
            transform: translateY(-5px);
            border-color: var(--gog-purple);
        }
        .game-card-lib img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .game-card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }
        .game-card-body h3 {
            font-size: 16px;
            color: #fff;
            margin: 0;
        }
        .game-card-body p {
            font-size: 12px;
            color: var(--text-muted);
            flex-grow: 1;
        }
        .btn-instalar {
            background: var(--gog-purple);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-instalar:hover {
            background: var(--gog-purple-hover);
            color: #fff;
        }
        .empty-library {
            text-align: center;
            padding: 60px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            grid-column: 1 / -1;
        }
        .empty-library h3 {
            color: #fff;
            margin-bottom: 10px;
        }
        .empty-library p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-explorar {
            display: inline-block;
            background: var(--gog-purple);
            color: #000;
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 6px;
            text-decoration: none;
        }
        .btn-explorar:hover {
            background: var(--gog-purple-hover);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- NAVBAR BÁSICA SUPERIOR -->
    <nav class="navbar" style="padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); border-bottom: 1px solid var(--glass-border);">
        <div class="logo">
            <h1 style="font-size: 20px;">NEXUS <span>GAMING</span></h1>
        </div>
        <div class="menu" style="display: flex; gap: 20px; list-style: none; align-items: center;">
            <li><a href="../../index.html" style="color: var(--text-muted); text-decoration: none;">Inicio</a></li>
            <li><a href="perfil.html" style="color: var(--text-muted); text-decoration: none;">Mi Perfil</a></li>
            <li><a href="biblioteca.html" style="color: #fff; text-decoration: none; font-weight: bold;">Mi Biblioteca</a></li>
            <li><a href="historial.html" style="color: var(--text-muted); text-decoration: none;">Historial</a></li>
        </div>
    </nav>

    <div class="biblioteca-container">
        <div class="biblioteca-header">
            <h2>🎮 Mi Biblioteca de Juegos</h2>
            <p>Aquí tienes tus juegos adquiridos listos para descargar y jugar.</p>
        </div>

        <!-- GRILLA DE JUEGOS DINÁMICA -->
        <div class="grid-biblioteca" id="grid-biblioteca">
            <!-- Se llenará mediante biblioteca.js -->
        </div>
    </div>

    <!-- Archivo JS correspondiente a la Biblioteca -->
    <script src="biblioteca.js"></script>
</body>
</html>
