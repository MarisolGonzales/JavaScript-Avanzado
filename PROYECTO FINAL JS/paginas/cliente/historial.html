<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Compras - NEXUS GAMING</title>
    <!-- Ruta relativa para subir 2 niveles y encontrar styles.css -->
    <link rel="stylesheet" href="../../styles.css">
    <style>
        .historial-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .historial-header {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }
        .historial-header h2 {
            font-size: 24px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .historial-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }
        
        .tabla-wrapper {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tabla-historial {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .tabla-historial th {
            background: rgba(171, 127, 255, 0.1);
            color: #fff;
            padding: 15px 20px;
            font-weight: 600;
            border-bottom: 1px solid var(--glass-border);
        }

        .tabla-historial td {
            padding: 15px 20px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--glass-border);
        }

        .tabla-historial tr:last-child td {
            border-bottom: none;
        }

        .tabla-historial tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
        }

        .juego-nombre {
            color: #fff;
            font-weight: 600;
        }

        .badge-estado {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(76, 209, 55, 0.15);
            color: #4cd137;
        }
    </style>
</head>
<body>

    <!-- NAVBAR BÁSICA SUPERIOR -->
    <nav class="navbar" style="padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); border-bottom: 1px solid var(--glass-border);">
        <div class="logo">
            <h1 style="font-size: 20px;">NEXUS <span>GAMING</span></h1>
        </div>
        <div class="menu" style="display: flex; gap: 20px; list-style: none; align-items: center;">
            <li><a href="../../index.html" style="color: var(--text-muted); text-decoration: none;">Inicio</a></li>
            <li><a href="perfil.html" style="color: var(--text-muted); text-decoration: none;">Mi Perfil</a></li>
            <li><a href="biblioteca.html" style="color: var(--text-muted); text-decoration: none;">Mi Biblioteca</a></li>
            <li><a href="historial.html" style="color: #fff; text-decoration: none; font-weight: bold;">Historial</a></li>
        </div>
    </nav>

    <div class="historial-container">
        <div class="historial-header">
            <h2>📜 Historial de Compras y Transacciones</h2>
            <p>Revisa todos tus recibos y pagos realizados en la tienda.</p>
        </div>

        <div class="tabla-wrapper">
            <table class="tabla-historial">
                <thead>
                    <tr>
                        <th>N° Orden</th>
                        <th>Fecha</th>
                        <th>Juego</th>
                        <th>Método de Pago</th>
                        <th>Monto</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historial-body">
                    <!-- Los datos se inyectarán de forma dinámica mediante JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Archivo JS correspondiente al Historial -->
    <script src="historial.js"></script>
</body>
</html>
