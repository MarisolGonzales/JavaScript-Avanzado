<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Logros - Integrante 3</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#040406">
</head>
<body>
  <h1>Mis Logros</h1>
  <p><a href="detalle.html">Volver al detalle</a> • <a href="favoritos.html">Ver favoritos</a></p>
  <div id="list">Cargando logros...</div>
  <div style="margin-top:18px">
    <!-- Botón que simula completar una compra y desbloquear el logro -->
    <button id="simulatePurchase">Simular compra (desbloquear "Primera compra")</button>
  </div>
  <script>
    function readJSON(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }
    function writeJSON(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

    var defaultAchievements = {
      first_favorite: {key:'first_favorite', title:'Primer favorito', desc:'Añadir tu primer juego a favoritos'},
      first_purchase: {key:'first_purchase', title:'Primera compra', desc:'Completar la primera compra (simulada)'}
    };

    var list = document.getElementById('list');
    function render(){
      var stored = readJSON('achievements') || {};
      list.innerHTML = '';
      Object.keys(defaultAchievements).forEach(function(k){
        var meta = defaultAchievements[k];
        var s = stored[k] && stored[k].unlocked;
        var div = document.createElement('div');
        div.className = 'ach';
        div.innerHTML = '<div><strong>'+meta.title+'</strong> - <span class="'+(s? 'unlocked':'locked')+'">'+(s? 'Desbloqueado':'Bloqueado')+'</span></div>'+
                        '<div>'+meta.desc+'</div>';
        if(s){
          div.innerHTML += '<div style="font-size:12px;color:#666">Fecha: '+(stored[k].unlockedAt||'--')+'</div>';
        }
        list.appendChild(div);
      });
    }
    render();
n    document.getElementById('simulatePurchase').addEventListener('click', function(){
      var ach = readJSON('achievements') || {};
      if(!ach.first_purchase){
        ach.first_purchase = { unlocked:true, message:'Has realizado tu primera compra (simulado)', unlockedAt: new Date().toISOString() };
        writeJSON('achievements', ach);
        alert('Logro "Primera compra" desbloqueado (simulación).');
        render();
      } else {
        alert('Ya desbloqueaste este logro.');
      }
    });
  </script>
</body>
</html>
