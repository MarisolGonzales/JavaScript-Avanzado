<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - NEXUS GAMING</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>

    <div class="perfil-layout">
        <!-- COLUMNA IZQUIERDA: MENÚ Y DATOS DE SESIÓN -->
        <div class="perfil-sidebar">
            <img id="perfil-img-avatar" src="" alt="Avatar" class="perfil-avatar">
            <h3 id="perfil-nombre-usuario">Cargando...</h3>
            <p id="perfil-email-usuario" style="font-size: 13px; color: var(--text-muted);"></p>

            <div class="perfil-nav-links">
                <a href="perfil.html" class="active">👤 Mi Perfil</a>
                <a href="biblioteca.html">🎮 Mi Biblioteca</a>
                <a href="historial.html">📜 Historial de Compras</a>
            </div>
        </div>

        <!-- COLUMNA DERECHA: INFORMACIÓN DETALLADA -->
        <div class="perfil-content">
            <h2>Detalles de la Cuenta</h2>
            
            <div class="info-group">
                <label>Nombre de usuario</label>
                <p id="info-nombre">-</p>
            </div>

            <div class="info-group">
                <label>Correo Electrónico</label>
                <p id="info-email">-</p>
            </div>

            <div class="info-group">
                <label>Estado de la Cuenta</label>
                <p style="color: #4cd137;">Activa (NEXUS Member)</p>
            </div>

            <a href="../../index.html" class="btn-volver">Volver al Inicio</a>
        </div>
    </div>

    <!-- SCRIPT QUE CARGA LOS DATOS DEL USUARIO ACTIVO -->
    <script>
        const usuarioSesion = localStorage.getItem('nexus_usuario_activo');

        if (usuarioSesion) {
            const usuario = JSON.parse(usuarioSesion);

            // Rellenar datos en pantalla
            document.getElementById('perfil-img-avatar').src = usuario.avatar;
            document.getElementById('perfil-nombre-usuario').textContent = usuario.nombre;
            document.getElementById('perfil-email-usuario').textContent = usuario.email;
            
            document.getElementById('info-nombre').textContent = usuario.nombre;
            document.getElementById('info-email').textContent = usuario.email;
        } else {
            alert('No has iniciado sesión.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
