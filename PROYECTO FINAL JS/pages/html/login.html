<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NEXUS GAMING</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../css/cliente.css">
</head>
<body class="body-login">

    <div class="login-container">
        <div class="login-header">
            <h1>NEXUS <span>GAMING</span></h1>
            <h2>Iniciar sesión en Nexus Gaming</h2>
        </div>

        <form id="form-login" class="form-login">
            <div class="form-group">
                <input type="email" id="login-email" placeholder="Dirección de correo electrónico" required>
            </div>
            
            <div class="form-group">
                <input type="password" id="login-password" placeholder="Contraseña" required>
            </div>

            <button type="submit" class="btn-login-submit">Ingresar a mi Cuenta</button>
        </form>

        <p class="login-toggle-text">
            ¿Es la primera vez que estás aquí? <a href="registro.html">Crear una cuenta</a>
        </p>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
