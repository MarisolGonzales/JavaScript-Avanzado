<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - NEXUS GAMING</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../css/catalogo.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <h1>NEXUS <span>GAMING</span></h1>
    </div>

    <div class="nav-derecha">
      <ul class="menu">
        <li><a href="../../index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
        <li><a href="catalogo.html" class="active"><i class="fa-solid fa-gamepad"></i> Catálogo</a></li>
        <li><a href="biblioteca.html"><i class="fa-solid fa-bookmark"></i> Mi Biblioteca</a></li>
        <li><a href="historial.html"><i class="fa-solid fa-clock-rotate-left"></i> Historial</a></li>
      </ul>

      <button class="btn-carrito" id="btn-carrito-catalogo">
        <i class="fa-solid fa-cart-shopping"></i> Carrito
        <span class="badge" id="contador-carrito">0</span>
      </button>
    </div>
  </nav>

  <main class="catalog-page">
    <section class="catalog-hero" aria-labelledby="catalog-title">
      <img src="../../JUEGOS/witcher3-banner.jpg" alt="The Witcher 3: Wild Hunt" class="hero-image">
      <div class="hero-shade"></div>

      <div class="hero-content">
        <p class="eyebrow">Juego destacado</p>
        <h1 id="catalog-title">The Witcher 3: Wild Hunt</h1>
        <p class="hero-copy">
          Una aventura de mundo abierto llena de monstruos, magia y decisiones
          que cambian la historia.
        </p>

        <div class="hero-actions">
          <a href="detalle.html?id=witcher3" class="btn-primary">
            <i class="fa-solid fa-circle-info"></i> Ver detalle
          </a>
          <a href="carrito.html" class="btn-secondary">
            <i class="fa-solid fa-cart-shopping"></i> Mi carrito
          </a>
        </div>
      </div>
    </section>

    <section class="catalog-tools" aria-label="Buscar y filtrar catálogo">
      <label class="search-box" for="buscador">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="search"
          id="buscador"
          placeholder="Buscar títulos, géneros o franquicias..."
          autocomplete="off"
        >
      </label>

      <div class="category-filters" id="category-filters" aria-label="Categorías"></div>
    </section>

    <section class="catalog-rows" id="catalog-grid" aria-live="polite"></section>
  </main>

  <script src="../js/catalogo.js"></script>
</body>
</html>
